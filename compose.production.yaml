services:
  video:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    env_file: .env.ai
    ports:
      - "127.0.0.1:5175:5175"
    volumes:
      - video-runtime:/app/runtime
    shm_size: 512mb
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 2g
    cpus: 1.5
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5175/api/ai/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  video-runtime:
